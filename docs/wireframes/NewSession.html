<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Session</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Helvetica Neue",Helvetica,system-ui,sans-serif;background:#ffffff;color:#1f1f1f}
a{color:#1f1f1f}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #9a9a96; border: 2px solid #3a3a3a; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #1f1f1f;">

  <div style="width: 560px; box-sizing: border-box; border: 2px solid #3a3a3a; background: #ffffff; display: flex; flex-direction: column;">
    <div style="box-sizing: border-box; padding: 16px 24px; background: #dcdcd8; border-bottom: 2px solid #3a3a3a; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 20px; font-weight: 700;">New session (REQ-1)</span>
      <span style="font-size: 13px; color: #5a5a5a;">shown on launch and from Session ▾</span>
    </div>

    <div style="box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="session-name" style="font-weight: 700;">Session name</label>
        <input id="session-name" type="text" placeholder="Friday night" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid #3a3a3a; font-size: 16px; width: 100%;">
        <span style="font-size: 12px; color: #5a5a5a;">Required. Used as the file name.</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="session-date" style="font-weight: 700;">Date</label>
          <input id="session-date" type="text" value="2026-09-22" readonly style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid #b8b8b4; background: #f4f4f2; font-size: 16px; width: 100%; color: #5a5a5a;">
          <span style="font-size: 12px; color: #5a5a5a;">Set automatically to today.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="default-buyin" style="font-weight: 700;">Default buy-in</label>
          <input id="default-buyin" type="text" value="20.00" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 2px solid #3a3a3a; font-size: 16px; width: 100%;">
          <span style="font-size: 12px; color: #5a5a5a;">Pre-fills every buy-in (REQ-12).</span>
        </div>
      </div>

      <div style="box-sizing: border-box; padding: 12px 16px; border: 2px dashed #3a3a3a; background: #f4f4f2; display: flex; flex-direction: column; gap: 8px;">
        <div style="font-weight: 700; font-size: 13px;">Or open a recent session (REQ-3)</div>
        <div style="display: flex; justify-content: space-between; font-size: 14px;"><span>2026-09-19_Friday_night.pokertab.json</span><span style="text-decoration: underline;">Open</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 14px;"><span>2026-09-12_Tuesday.pokertab.json</span><span style="text-decoration: underline;">Open</span></div>
      </div>
    </div>

    <div style="box-sizing: border-box; padding: 16px 24px; border-top: 2px solid #3a3a3a; background: #f4f4f2; display: flex; justify-content: flex-end; gap: 12px;">
      <button type="button" style="height: 44px; padding: 0 20px; border: 2px solid #3a3a3a; background: #ffffff; font-size: 15px; font-weight: 700;">Cancel</button>
      <button type="button" style="height: 44px; padding: 0 24px; border: 2px solid #3a3a3a; background: #3a3a3a; color: #ffffff; font-size: 15px; font-weight: 700;">Create session</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
